<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8"/>
        <title>Tiny WASM Playground</title>
    </head>
    <body>
        <div id="control-panel">
            <label>Rendering Settings</label>
            <label>Width:</label>
            <input type="number", value="60", min="0", max="1920"/>
            <label>Height:</label>
            <input type="number", value="40", min="0", max="1080"/>
            <label>Samples Per Pixel</label>
            <input type="number", value="10", min="1", max="50"/>
            <label>Bounce Depth</label>
            <input type="number", value="50", min="1", max="250"/>
            <input type="button", id="start_render_button", name="Get-Next", value="Start Render"/>
        </div>
        <canvas id="draw-area"></canvas>
        <script type="module">
            import init, { Renderer } from "./pkg/tinywasm_playground.js"
            await init(); // must await so that the WASM file gets loaded.

            let renderer = Renderer.new();

            async function buttonCallback() {
                renderer.start("draw-area");
            }

            // add callback to button so it gets the data
            start_render_button.addEventListener('click', buttonCallback)
        </script>
    </body>
</html>
